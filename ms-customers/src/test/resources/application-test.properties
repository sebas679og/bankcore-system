# Configuracion General de la Aplicacion
server.port=8081
logging.level.org.springframework.security.authentication.ProviderManager=WARN
logging.level.org.springframework.security.authentication.dao.DaoAuthenticationProvider=WARN
spring.application.name=ms-customers

# Configuracion de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# Configuracion de CORS
app.cors.max-age=3600
app.cors.allowed-origins=http://localhost:3000
app.cors.allowed-methods=GET,POST,PUT,DELETE,PATCH

# Configuracion de Seguridad (JWT)
